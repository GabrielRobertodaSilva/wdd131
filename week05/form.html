<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="style/styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            
            <div class="form-item">
                <label for="productName">Product Name <span class="required">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                    
                </select>
            </div>

            
            <fieldset class="form-item">
                <legend>Overall Rating <span class="required">*</span></legend>
                <div class="rating-stars">
                    <label><input type="radio" name="rating" value="1" required> &star;</label>
                    <label><input type="radio" name="rating" value="2" required> &star;&star;</label>
                    <label><input type="radio" name="rating" value="3" required> &star;&star;&star;</label>
                    <label><input type="radio" name="rating" value="4" required> &star;&star;&star;&star;</label>
                    <label><input type="radio" name="rating" value="5" required> &star;&star;&star;&star;&star;</label>
                </div>
            </fieldset>

            
            <div class="form-item">
                <label for="installDate">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            
            <fieldset class="form-item">
                <legend>Which features were useful in your product? (Check all that apply)</legend>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="features" value="durability"> Durability</label>
                    <label><input type="checkbox" name="features" value="ease"> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="performance"> Performance</label>
                    <label><input type="checkbox" name="features" value="design"> Design</label>
                </div>
            </fieldset>

            
            <div class="form-item">
                <label for="writtenReview">Written Review (Optional)</label>
                <textarea id="writtenReview" name="writtenReview" rows="4"></textarea>
            </div>

            
            <div class="form-item">
                <label for="userName">Your Name (Optional)</label>
                <input type="text" id="userName" name="userName">
            </div>

            
            <div class="form-item">
                <input type="submit" value="Post Review">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | 🌵 Gabriel Roberto da Silva 🌵 | Santa Catarina</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
